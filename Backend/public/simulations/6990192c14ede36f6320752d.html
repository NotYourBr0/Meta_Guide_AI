<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Projectile Motion Simulator</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #38bdf8;
            --accent-hover: #0ea5e9;
            --vacuum-color: #10b981;
            --linear-color: #f59e0b;
            --quad-color: #ef4444;
            --border-radius: 8px;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        header {
            padding: 1rem 2rem;
            background: var(--panel-bg);
            border-bottom: 1px solid #334155;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 { margin: 0; font-size: 1.25rem; font-weight: 600; color: var(--accent-color); }

        .main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* Sidebar Controls */
        .controls {
            width: 320px;
            background: var(--panel-bg);
            padding: 1.5rem;
            border-right: 1px solid #334155;
            overflow-y: auto;
            box-shadow: 4px 0 15px rgba(0,0,0,0.3);
        }

        .control-group { margin-bottom: 1.5rem; }
        .control-group label {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            margin-bottom: 0.5rem;
            color: #94a3b8;
        }
        .control-group label span { color: var(--text-color); font-weight: bold; }

        input[type="range"] {
            width: 100%;
            cursor: pointer;
            accent-color: var(--accent-color);
        }

        .btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.5rem;
            margin-top: 1rem;
        }

        button {
            padding: 0.6rem;
            border: none;
            border-radius: var(--border-radius);
            background: #334155;
            color: white;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }
        button:hover { background: #475569; }
        button.primary { background: var(--accent-color); color: var(--bg-color); }
        button.primary:hover { background: var(--accent-hover); }

        /* Simulation Area */
        .simulation-viewport {
            flex: 1;
            position: relative;
            background: radial-gradient(circle at top right, #1e293b, #0f172a);
            display: flex;
            flex-direction: column;
        }

        canvas {
            flex: 1;
            width: 100%;
            height: 100%;
            cursor: crosshair;
        }

        /* Stats Overlay */
        .stats-overlay {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(15, 23, 42, 0.8);
            padding: 1rem;
            border-radius: var(--border-radius);
            border: 1px solid #334155;
            backdrop-filter: blur(4px);
            min-width: 200px;
            pointer-events: none;
        }

        .stat-item {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            margin-bottom: 0.3rem;
        }
        .stat-item:last-child { margin-bottom: 0; }
        .stat-label { color: #94a3b8; }

        .legend {
            position: absolute;
            bottom: 20px;
            left: 20px;
            display: flex;
            gap: 15px;
            font-size: 0.8rem;
        }
        .legend-item { display: flex; align-items: center; gap: 5px; }
        .dot { width: 10px; height: 10px; border-radius: 50%; }

        @media (max-width: 768px) {
            .main-container { flex-direction: column; }
            .controls { width: 100%; height: auto; border-right: none; border-top: 1px solid #334155; }
            .stats-overlay { top: 10px; right: 10px; padding: 0.5rem; font-size: 0.7rem; }
        }
    </style>
</head>
<body>

<header>
    <h1>Ballistics & Kinematics Sim</h1>
    <div style="font-size: 0.8rem; color: #64748b;">Solving ODEs via RK4 Integration</div>
</header>

<div class="main-container">
    <aside class="controls">
        <div class="control-group">
            <label>Initial Velocity (v₀) <span id="val-v0">50 m/s</span></label>
            <input type="range" id="v0" min="0" max="150" step="1" value="60">
        </div>

        <div class="control-group">
            <label>Launch Angle (θ) <span id="val-angle">45°</span></label>
            <input type="range" id="angle" min="0" max="90" step="0.5" value="45">
        </div>

        <div class="control-group">
            <label>Gravity (g) <span id="val-g">9.81 m/s²</span></label>
            <input type="range" id="g" min="0" max="40" step="0.1" value="9.81">
        </div>

        <div class="control-group">
            <label>Mass (m) <span id="val-m">1.0 kg</span></label>
            <input type="range" id="m" min="0.1" max="10" step="0.1" value="1">
        </div>

        <div class="control-group">
            <label>Drag Coeff (b or c) <span id="val-drag">0.10</span></label>
            <input type="range" id="drag" min="0" max="2" step="0.01" value="0.15">
        </div>

        <div class="control-group">
            <label>Sim Speed <span id="val-speed">1.0x</span></label>
            <input type="range" id="speed" min="0.1" max="3" step="0.1" value="1">
        </div>

        <div class="btn-group">
            <button id="btn-fire" class="primary">Launch</button>
            <button id="btn-clear">Clear Trajectories</button>
        </div>
        
        <div style="margin-top: 1.5rem; font-size: 0.75rem; color: #64748b; line-height: 1.4;">
            <p><strong>Models:</strong><br>
            • <span style="color:var(--vacuum-color)">■</span> Vacuum (Analytical Parabola)<br>
            • <span style="color:var(--linear-color)">■</span> Linear (Stokes Drag: F ∝ v)<br>
            • <span style="color:var(--quad-color)">■</span> Quadratic (Newton Drag: F ∝ v²)</p>
        </div>
    </aside>

    <main class="simulation-viewport">
        <canvas id="canvas"></canvas>
        
        <div class="stats-overlay" id="stats">
            <div style="font-weight:bold; color:var(--accent-color); margin-bottom: 5px;">Live Telemetry (Quadratic)</div>
            <div class="stat-item"><span class="stat-label">Range:</span> <span id="stat-range">0.00 m</span></div>
            <div class="stat-item"><span class="stat-label">Max Height:</span> <span id="stat-height">0.00 m</span></div>
            <div class="stat-item"><span class="stat-label">Time:</span> <span id="stat-time">0.00 s</span></div>
            <div class="stat-item"><span class="stat-label">Velocity:</span> <span id="stat-v">0.00 m/s</span></div>
        </div>

        <div class="legend">
            <div class="legend-item"><div class="dot" style="background:var(--vacuum-color)"></div> Vacuum</div>
            <div class="legend-item"><div class="dot" style="background:var(--linear-color)"></div> Linear Drag</div>
            <div class="legend-item"><div class="dot" style="background:var(--quad-color)"></div> Quadratic Drag</div>
        </div>
    </main>
</div>

<script>
    /**
     * Physics Engine & Constants
     */
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const stats = {
        range: document.getElementById('stat-range'),
        height: document.getElementById('stat-height'),
        time: document.getElementById('stat-time'),
        v: document.getElementById('stat-v')
    };

    let width, height;
    let pixelsPerMeter = 5;
    const groundY = 50; // pixels from bottom

    // State
    let activeProjectiles = [];
    let history = []; // To store persistent trajectory lines

    // Inputs
    const inputs = {
        v0: document.getElementById('v0'),
        angle: document.getElementById('angle'),
        g: document.getElementById('g'),
        m: document.getElementById('m'),
        drag: document.getElementById('drag'),
        speed: document.getElementById('speed')
    };

    const vals = {
        v0: document.getElementById('val-v0'),
        angle: document.getElementById('val-angle'),
        g: document.getElementById('val-g'),
        m: document.getElementById('val-m'),
        drag: document.getElementById('val-drag'),
        speed: document.getElementById('val-speed')
    };

    /**
     * Mathematical Models
     */
    
    // RK4 Solver for 2D Motion
    // state: [x, y, vx, vy]
    function getDerivatives(state, modelType, params) {
        const { g, m, drag } = params;
        const [x, y, vx, vy] = state;
        const v = Math.sqrt(vx * vx + vy * vy);

        let ax = 0;
        let ay = -g;

        if (modelType === 'linear') {
            ax = -(drag / m) * vx;
            ay = -g - (drag / m) * vy;
        } else if (modelType === 'quadratic') {
            ax = -(drag / m) * v * vx;
            ay = -g - (drag / m) * v * vy;
        }

        return [vx, vy, ax, ay];
    }

    function stepRK4(state, modelType, params, dt) {
        const k1 = getDerivatives(state, modelType, params);
        
        const s2 = state.map((v, i) => v + k1[i] * dt / 2);
        const k2 = getDerivatives(s2, modelType, params);
        
        const s3 = state.map((v, i) => v + k2[i] * dt / 2);
        const k3 = getDerivatives(s3, modelType, params);
        
        const s4 = state.map((v, i) => v + k3[i] * dt);
        const k4 = getDerivatives(s4, modelType, params);

        return state.map((v, i) => v + (dt / 6) * (k1[i] + 2 * k2[i] + 2 * k3[i] + k4[i]));
    }

    /**
     * Simulation Logic
     */

    function init() {
        resize();
        window.addEventListener('resize', resize);
        
        document.getElementById('btn-fire').addEventListener('click', fire);
        document.getElementById('btn-clear').addEventListener('click', () => {
            history = [];
            activeProjectiles = [];
        });

        // Update UI labels
        Object.keys(inputs).forEach(key => {
            inputs[key].addEventListener('input', () => {
                let suffix = '';
                if(key === 'v0') suffix = ' m/s';
                if(key === 'angle') suffix = '°';
                if(key === 'g') suffix = ' m/s²';
                if(key === 'm') suffix = ' kg';
                if(key === 'speed') suffix = 'x';
                vals[key].innerText = inputs[key].value + suffix;
            });
        });

        requestAnimationFrame(loop);
    }

    function resize() {
        width = canvas.width = canvas.clientWidth;
        height = canvas.height = canvas.clientHeight;
        // Auto-scale based on velocity to keep things in view
        pixelsPerMeter = width / 180; 
    }

    function fire() {
        const v0 = parseFloat(inputs.v0.value);
        const angleDeg = parseFloat(inputs.angle.value);
        const angleRad = angleDeg * Math.PI / 180;
        const g = parseFloat(inputs.g.value);
        const m = parseFloat(inputs.m.value);
        const drag = parseFloat(inputs.drag.value);

        const vx0 = v0 * Math.cos(angleRad);
        const vy0 = v0 * Math.sin(angleRad);

        const params = { g, m, drag };

        // Launch all 3 models for comparison
        const configs = [
            { type: 'vacuum', color: '#10b981', label: 'Vacuum' },
            { type: 'linear', color: '#f59e0b', label: 'Linear' },
            { type: 'quadratic', color: '#ef4444', label: 'Quadratic' }
        ];

        configs.forEach(cfg => {
            activeProjectiles.push({
                state: [0, 0, vx0, vy0], // x, y, vx, vy
                path: [[0, 0]],
                type: cfg.type,
                color: cfg.color,
                params: { ...params },
                time: 0,
                maxH: 0,
                finished: false
            });
        });
    }

    function loop(t) {
        const dt = (1/60) * parseFloat(inputs.speed.value);
        ctx.clearRect(0, 0, width, height);

        drawEnvironment();

        // Update and draw persistent history
        history.forEach(pathObj => {
            drawPath(pathObj.path, pathObj.color, 1, true);
        });

        // Update and draw active projectiles
        activeProjectiles.forEach((p, index) => {
            if (p.finished) return;

            // Integration Step
            p.state = stepRK4(p.state, p.type, p.params, dt);
            p.time += dt;
            p.path.push([p.state[0], p.state[1]]);
            
            if (p.state[1] > p.maxH) p.maxH = p.state[1];

            // Update stats overlay based on Quadratic (most realistic)
            if (p.type === 'quadratic') {
                stats.range.innerText = p.state[0].toFixed(2) + ' m';
                stats.height.innerText = p.maxH.toFixed(2) + ' m';
                stats.time.innerText = p.time.toFixed(2) + ' s';
                const vMag = Math.sqrt(p.state[2]**2 + p.state[3]**2);
                stats.v.innerText = vMag.toFixed(2) + ' m/s';
            }

            // Hit ground?
            if (p.state[1] < 0) {
                p.state[1] = 0;
                p.finished = true;
                history.push({ path: [...p.path], color: p.color });
            }
        });

        // Clean up finished projectiles from active list
        activeProjectiles = activeProjectiles.filter(p => !p.finished || p.path.length > 0);
        
        // Draw active
        activeProjectiles.forEach(p => {
            drawPath(p.path, p.color, 3, false);
            drawProjectile(p.state[0], p.state[1], p.color);
        });

        requestAnimationFrame(loop);
    }

    function drawEnvironment() {
        // Ground
        ctx.beginPath();
        ctx.strokeStyle = '#334155';
        ctx.lineWidth = 2;
        const groundLevel = height - groundY;
        ctx.moveTo(0, groundLevel);
        ctx.lineTo(width, groundLevel);
        ctx.stroke();

        // Grid (optional but helpful)
        ctx.beginPath();
        ctx.strokeStyle = 'rgba(51, 65, 85, 0.3)';
        ctx.lineWidth = 1;
        for(let i=0; i < width; i += 50) {
            ctx.moveTo(i, 0); ctx.lineTo(i, height);
        }
        for(let j=height-groundY; j > 0; j -= 50) {
            ctx.moveTo(0, j); ctx.lineTo(width, j);
        }
        ctx.stroke();
    }

    function drawPath(path, color, widthLine, isHistory) {
        if (path.length < 2) return;
        ctx.beginPath();
        ctx.strokeStyle = color;
        ctx.lineWidth = widthLine;
        ctx.globalAlpha = isHistory ? 0.4 : 1.0;
        if (isHistory) ctx.setLineDash([5, 5]); else ctx.setLineDash([]);
        
        const start = worldToScreen(path[0][0], path[0][1]);
        ctx.moveTo(start.x, start.y);

        for (let i = 1; i < path.length; i++) {
            const pt = worldToScreen(path[i][0], path[i][1]);
            ctx.lineTo(pt.x, pt.y);
        }
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.globalAlpha = 1.0;
    }

    function drawProjectile(x, y, color) {
        const screen = worldToScreen(x, y);
        ctx.beginPath();
        ctx.fillStyle = color;
        ctx.arc(screen.x, screen.y, 5, 0, Math.PI * 2);
        ctx.fill();
        
        // Glow effect
        ctx.shadowBlur = 10;
        ctx.shadowColor = color;
        ctx.stroke();
        ctx.shadowBlur = 0;
    }

    function worldToScreen(wx, wy) {
        return {
            x: wx * pixelsPerMeter,
            y: height - groundY - (wy * pixelsPerMeter)
        };
    }

    // Initialize the app
    init();

</script>
</body>
</html>
