<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tyndall Effect Simulation</title>
    <style>
        :root {
            --bg-color: #0a0a0c;
            --panel-color: #1a1a1f;
            --text-color: #e0e0e0;
            --accent-color: #4a90e2;
            --control-bg: #2d2d35;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        #main-container {
            display: flex;
            flex: 1;
            flex-direction: column;
            width: 100%;
            height: 100%;
        }

        @media (min-width: 900px) {
            #main-container {
                flex-direction: row;
            }
        }

        #viz-area {
            flex: 2;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: radial-gradient(circle at center, #1a1a24 0%, #0a0a0c 100%);
        }

        canvas {
            max-width: 100%;
            max-height: 100%;
            border-radius: 8px;
            box-shadow: 0 0 40px rgba(0,0,0,0.5);
        }

        #controls {
            flex: 1;
            background-color: var(--panel-color);
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            overflow-y: auto;
            border-top: 1px solid #333;
        }

        @media (min-width: 900px) {
            #controls {
                max-width: 350px;
                border-top: none;
                border-left: 1px solid #333;
            }
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .control-group label {
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #888;
            display: flex;
            justify-content: space-between;
        }

        .control-group label span {
            color: var(--accent-color);
        }

        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 6px;
            background: var(--control-bg);
            border-radius: 3px;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            background: var(--accent-color);
            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.1s ease;
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        .readout {
            font-family: monospace;
            background: #000;
            padding: 10px;
            border-radius: 4px;
            font-size: 0.9rem;
            margin-top: auto;
            color: #0f0;
            border-left: 3px solid #0f0;
        }
    </style>
</head>
<body>

<div id="main-container">
    <div id="viz-area">
        <canvas id="simCanvas"></canvas>
    </div>

    <div id="controls">
        <div class="control-group">
            <label>Wavelength <span id="wl-val">550 nm</span></label>
            <input type="range" id="wavelength" min="380" max="750" value="550">
        </div>

        <div class="control-group">
            <label>Particle Size <span id="size-val">100 nm</span></label>
            <input type="range" id="particleSize" min="1" max="1000" value="100">
        </div>

        <div class="control-group">
            <label>Concentration <span id="conc-val">50%</span></label>
            <input type="range" id="concentration" min="0" max="100" value="50">
        </div>

        <div class="control-group">
            <label>Relative RI <span id="ri-val">1.20</span></label>
            <input type="range" id="ri" min="100" max="200" value="120">
        </div>

        <div class="readout" id="status-display">
            System: Colloidal Suspension
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('simCanvas');
    const ctx = canvas.getContext('2d');
    const wavelengthInput = document.getElementById('wavelength');
    const sizeInput = document.getElementById('particleSize');
    const concInput = document.getElementById('concentration');
    const riInput = document.getElementById('ri');

    const wlReadout = document.getElementById('wl-val');
    const sizeReadout = document.getElementById('size-val');
    const concReadout = document.getElementById('conc-val');
    const riReadout = document.getElementById('ri-val');
    const statusDisplay = document.getElementById('status-display');

    let width, height;
    let particles = [];

    function initCanvas() {
        const container = document.getElementById('viz-area');
        const dpr = window.devicePixelRatio || 1;
        width = container.clientWidth - 40;
        height = Math.min(container.clientHeight - 40, 500);
        canvas.width = width * dpr;
        canvas.height = height * dpr;
        canvas.style.width = width + 'px';
        canvas.style.height = height + 'px';
        ctx.scale(dpr, dpr);
        createParticles();
    }

    function createParticles() {
        particles = [];
        for (let i = 0; i < 200; i++) {
            particles.push({
                x: Math.random() * width,
                y: Math.random() * height,
                offset: Math.random() * Math.PI * 2,
                speed: 0.2 + Math.random() * 0.5
            });
        }
    }

    function wlToRgb(wavelength) {
        let r, g, b, alpha;
        if (wavelength >= 380 && wavelength < 440) {
            r = (-1 * (wavelength - 440)) / (440 - 380);
            g = 0;
            b = 1;
        } else if (wavelength >= 440 && wavelength < 490) {
            r = 0;
            g = (wavelength - 440) / (490 - 440);
            b = 1;
        } else if (wavelength >= 490 && wavelength < 510) {
            r = 0;
            g = 1;
            b = (-1 * (wavelength - 510)) / (510 - 490);
        } else if (wavelength >= 510 && wavelength < 580) {
            r = (wavelength - 510) / (580 - 510);
            g = 1;
            b = 0;
        } else if (wavelength >= 580 && wavelength < 645) {
            r = 1;
            g = (-1 * (wavelength - 645)) / (645 - 580);
            b = 0;
        } else if (wavelength >= 645 && wavelength <= 750) {
            r = 1;
            g = 0;
            b = 0;
        } else {
            r = 0; g = 0; b = 0;
        }

        if (wavelength >= 380 && wavelength < 420) alpha = 0.3 + 0.7 * (wavelength - 380) / (420 - 380);
        else if (wavelength >= 420 && wavelength <= 700) alpha = 1.0;
        else if (wavelength >= 700 && wavelength <= 750) alpha = 0.3 + 0.7 * (750 - wavelength) / (750 - 700);
        else alpha = 0;

        return {
            r: Math.round(r * 255),
            g: Math.round(g * 255),
            b: Math.round(b * 255),
            a: alpha
        };
    }

    function draw() {
        const wl = parseInt(wavelengthInput.value);
        const size = parseInt(sizeInput.value);
        const conc = parseInt(concInput.value) / 100;
        const ri = parseInt(riInput.value) / 100;

        wlReadout.innerText = `${wl} nm`;
        sizeReadout.innerText = `${size} nm`;
        concReadout.innerText = `${Math.round(conc * 100)}%`;
        riReadout.innerText = ri.toFixed(2);

        // Physics Logic
        let scatteringIntensity = 0;
        let type = "";
        
        // Rayleigh-like approximation for small particles, Mie for larger
        if (size < 10) {
            scatteringIntensity = conc * Math.pow(size/10, 3) * Math.pow(400/wl, 4) * (ri - 1);
            type = "True Solution (No Visible Tyndall Effect)";
        } else if (size <= 500) {
            scatteringIntensity = conc * (size/100) * Math.pow(450/wl, 2) * (ri - 0.9);
            type = "Colloidal System (Tyndall Effect Observed)";
        } else {
            scatteringIntensity = conc * 2.5 * (ri - 0.8);
            type = "Suspension (Strong Scattering / Turbid)";
        }

        statusDisplay.innerText = `System: ${type}`;

        ctx.clearRect(0, 0, width, height);

        // Draw Beaker/Tank
        ctx.fillStyle = '#111116';
        ctx.fillRect(0, 0, width, height);
        ctx.strokeStyle = '#333';
        ctx.lineWidth = 2;
        ctx.strokeRect(0, 0, width, height);

        const color = wlToRgb(wl);
        const colorStr = `rgba(${color.r}, ${color.g}, ${color.b},`;
        
        // Incident Light Beam (Left side external)
        ctx.shadowBlur = 15;
        ctx.shadowColor = `${colorStr} 0.5)`;
        ctx.fillStyle = `${colorStr} 0.8)`;
        ctx.fillRect(-20, height/2 - 15, 30, 30);

        // Path Visibility (The Tyndall Effect)
        const beamAlpha = Math.min(scatteringIntensity * 0.8, 0.9);
        if (beamAlpha > 0.01) {
            let gradient = ctx.createLinearGradient(0, height/2, width, height/2);
            // Attenuation (Beer-Lambert)
            const attenuation = Math.exp(-scatteringIntensity * 1.5);
            gradient.addColorStop(0, `${colorStr} ${beamAlpha})`);
            gradient.addColorStop(1, `${colorStr} ${beamAlpha * attenuation})`);
            
            ctx.fillStyle = gradient;
            ctx.shadowBlur = 10 * scatteringIntensity;
            ctx.fillRect(0, height/2 - 15, width, 30);
        }

        // Draw Particles
        if (size > 5) {
            const time = Date.now() * 0.001;
            particles.forEach((p, i) => {
                if (i > conc * 200) return;
                
                const movement = Math.sin(time * p.speed + p.offset) * 2;
                const px = p.x;
                const py = p.y + movement;
                
                // Particle glows when in beam
                const inBeam = py > height/2 - 25 && py < height/2 + 25;
                const pSize = Math.max(1, size / 100);
                
                if (inBeam) {
                    const pAlpha = Math.min(1, (scatteringIntensity + 0.2));
                    ctx.fillStyle = `${colorStr} ${pAlpha})`;
                    ctx.shadowBlur = 5;
                    ctx.beginPath();
                    ctx.arc(px, py, pSize, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    ctx.fillStyle = 'rgba(100, 100, 100, 0.2)';
                    ctx.shadowBlur = 0;
                    ctx.beginPath();
                    ctx.arc(px, py, pSize * 0.5, 0, Math.PI * 2);
                    ctx.fill();
                }
            });
        }

        // Transmitted Light Spot
        const transAlpha = Math.max(0.05, Math.exp(-scatteringIntensity * 2));
        ctx.shadowBlur = 20;
        ctx.fillStyle = `${colorStr} ${transAlpha})`;
        ctx.beginPath();
        ctx.arc(width + 10, height/2, 25, 0, Math.PI * 2);
        ctx.fill();

        requestAnimationFrame(draw);
    }

    window.addEventListener('resize', initCanvas);
    initCanvas();
    draw();

</script>
</body>
</html></html>
